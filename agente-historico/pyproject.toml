[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "historico"
version = "0.1.0"
description = "Agente Histórico: análisis y control de calidad del histórico PV de San Carlos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]",
    "psycopg-pool",
    "anthropic",
    "python-dotenv",
    "pvlib",    # ventana solar y clear-sky de la capa de calidad
    "pandas",   # idem
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]   # httpx: lo exige TestClient de FastAPI
service = ["fastapi", "uvicorn[standard]"]

[project.scripts]
historico = "historico.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
