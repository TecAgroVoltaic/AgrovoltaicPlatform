[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comparador"
version = "0.1.0"
description = "Comparador: control de calidad determinista del historico PV de San Carlos + caracterizacion del cielo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]",
    "psycopg-pool",
    "pvlib",
    "pandas",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
comparador = "comparador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
