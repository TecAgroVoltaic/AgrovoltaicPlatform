# Sidecar del historico PV (microservicio FastAPI con las tools de análisis).
#
# Proyecto compose INDEPENDIENTE (name: historico), fuera del repo Agent-Runtime,
# para no morir con el `git reset --hard` del deploy del Backend. Usa red del host
# y nginx le llega por host.docker.internal:8010. Puerto 8010 (el 8000 lo usa el
# forecaster).
#
# Uso (en la EC2, desde /home/ec2-user/historico):
#   docker compose -f docker-compose.historico.yml up -d --build
#
# Requiere: ./agente-historico (código, vía rsync) y ./historico.env (NO se versiona).
name: historico

services:
  historico:
    build:
      context: ${HISTORICO_BUILD_CONTEXT:-./agente-historico}
      dockerfile: Dockerfile
    image: historico-pv:latest
    network_mode: host
    command: ["uvicorn", "historico.api:app", "--host", "127.0.0.1", "--port", "8010"]
    env_file:
      - historico.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
