<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 624" width="760" height="624" role="img" aria-label="Diagrama de la arquitectura propuesta por capas">
  <text x="0" y="12" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b0b0b">1 · Captura en campo — San Carlos</text>
  <rect x="0" y="22" width="168" height="46" rx="6" fill="#fcfcfb" stroke="#d9d8d4" stroke-width="1"/>
  <rect x="184" y="22" width="168" height="46" rx="6" fill="#fcfcfb" stroke="#d9d8d4" stroke-width="1"/>
  <rect x="368" y="22" width="168" height="46" rx="6" fill="#fcfcfb" stroke="#d9d8d4" stroke-width="1"/>
  <text x="12" y="41" font-family="Helvetica, Arial, sans-serif" font-size="9.6" fill="#33322e">Inversor · 2 arreglos</text>
  <text x="12" y="57" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">voltaje, corriente, potencia</text>
  <text x="196" y="41" font-family="Helvetica, Arial, sans-serif" font-size="9.6" fill="#33322e">Piranómetros</text>
  <text x="196" y="57" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">incidente, reflejada, albedo</text>
  <text x="380" y="41" font-family="Helvetica, Arial, sans-serif" font-size="9.6" fill="#33322e">Sensores de temperatura</text>
  <text x="380" y="57" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">arreglo inclinado y vertical</text>
  <rect x="576" y="22" width="184" height="46" rx="6" fill="#fcfcfb" stroke="#d9d8d4" stroke-width="1"/>
  <text x="588" y="41" font-family="Helvetica, Arial, sans-serif" font-size="9.6" fill="#33322e">Archivos CSV diarios</text>
  <text x="588" y="57" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">285 archivos · 13 estructuras</text>
  <line x1="540" y1="45" x2="565" y2="45" stroke="#8a8985" stroke-width="1.2"/><path d="M565,41 L565,49 L572,45 z" fill="#8a8985"/>
  <line x1="668" y1="68" x2="668" y2="87" stroke="#8a8985" stroke-width="1.2"/><path d="M664,87 L672,87 L668,94 z" fill="#8a8985"/>
  <text x="0" y="114" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b0b0b">2 · Procesamiento — Python</text>
  <rect x="0" y="124" width="760" height="52" rx="6" fill="#f7f9fd" stroke="#2a78d6" stroke-width="1.4"/>
  <text x="676" y="119" font-family="Helvetica, Arial, sans-serif" font-size="7.8" font-weight="700" letter-spacing="0.6" fill="#2a78d6">OPERANDO</text>
  <text x="14" y="145" font-family="Helvetica, Arial, sans-serif" font-size="9.6" fill="#33322e">Lectura tolerante → normalización de nombres → separación por subsistema → homogeneización temporal → carga idempotente</text>
  <text x="14" y="162" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">pandas · psycopg · control por huella digital de archivo y por marca de tiempo · reprocesable sin duplicar</text>
  <line x1="380" y1="176" x2="380" y2="195" stroke="#8a8985" stroke-width="1.2"/><path d="M376,195 L384,195 L380,202 z" fill="#8a8985"/>
  <text x="0" y="222" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b0b0b">3 · Almacenamiento — PostgreSQL en la nube</text>
  <rect x="0" y="232" width="372" height="50" rx="6" fill="#f7f9fd" stroke="#2a78d6" stroke-width="1.4"/>
  <rect x="388" y="232" width="372" height="50" rx="6" fill="#f7f9fd" stroke="#2a78d6" stroke-width="1.4"/>
  <text x="676" y="227" font-family="Helvetica, Arial, sans-serif" font-size="7.8" font-weight="700" letter-spacing="0.6" fill="#2a78d6">OPERANDO</text>
  <text x="14" y="251" font-family="Helvetica, Arial, sans-serif" font-size="9.6" fill="#33322e">Eléctrico crudo · 5 min</text>
  <text x="14" y="268" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">36.469 registros · valor tal como lo entregó el sensor</text>
  <text x="402" y="251" font-family="Helvetica, Arial, sans-serif" font-size="9.6" fill="#33322e">Radiación cruda · 15 s</text>
  <text x="402" y="268" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">94.868 registros · almacenamiento separado</text>
  <line x1="380" y1="282" x2="380" y2="301" stroke="#8a8985" stroke-width="1.2"/><path d="M376,301 L384,301 L380,308 z" fill="#8a8985"/>
  <text x="0" y="328" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b0b0b">4 · Capa de análisis — corrección sobre el crudo</text>
  <rect x="0" y="338" width="248" height="50" rx="6" fill="#f7f9fd" stroke="#2a78d6" stroke-width="1.4"/>
  <rect x="256" y="338" width="248" height="50" rx="6" fill="#f7f9fd" stroke="#2a78d6" stroke-width="1.4"/>
  <rect x="512" y="338" width="248" height="50" rx="6" fill="#f7f9fd" stroke="#2a78d6" stroke-width="1.4"/>
  <text x="14" y="357" font-family="Helvetica, Arial, sans-serif" font-size="9.6" fill="#33322e">Validez eléctrica</text>
  <text x="14" y="374" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">temperatura 10–80 °C, rangos físicos</text>
  <text x="270" y="357" font-family="Helvetica, Arial, sans-serif" font-size="9.6" fill="#33322e">Validez de radiación</text>
  <text x="270" y="374" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">desfase, negativos, periodo inicial</text>
  <text x="526" y="357" font-family="Helvetica, Arial, sans-serif" font-size="9.6" fill="#33322e">Diccionario de variables</text>
  <text x="526" y="374" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">definición y unidad de cada campo</text>
  <line x1="380" y1="388" x2="380" y2="407" stroke="#8a8985" stroke-width="1.2"/><path d="M376,407 L384,407 L380,414 z" fill="#8a8985"/>
  <text x="0" y="434" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b0b0b">5 · Capa de agentes — en construcción</text>
  <rect x="0" y="444" width="760" height="96" rx="6" fill="#fcfcfb" stroke="#8a8985" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="650" y="439" font-family="Helvetica, Arial, sans-serif" font-size="7.8" font-weight="700" letter-spacing="0.6" fill="#6d6c68">EN CONSTRUCCIÓN</text>
  <rect x="14" y="458" width="230" height="68" rx="6" fill="#fcfcfb" stroke="#d9d8d4" stroke-width="1"/>
  <rect x="258" y="458" width="230" height="68" rx="6" fill="#fcfcfb" stroke="#d9d8d4" stroke-width="1"/>
  <rect x="502" y="458" width="244" height="68" rx="6" fill="#fcfcfb" stroke="#d9d8d4" stroke-width="1"/>
  <text x="26" y="477" font-family="Helvetica, Arial, sans-serif" font-size="9.6" fill="#33322e">Detección determinista</text>
  <text x="26" y="493" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">estadística y series de tiempo</text>
  <text x="26" y="506" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">sobre la capa de análisis;</text>
  <text x="26" y="519" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">sin modelo de lenguaje</text>
  <text x="270" y="477" font-family="Helvetica, Arial, sans-serif" font-size="9.6" fill="#33322e">Registro de hallazgos</text>
  <text x="270" y="493" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">qué se detectó, cuándo y con</text>
  <text x="270" y="506" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">qué evidencia numérica;</text>
  <text x="270" y="519" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">base de la trazabilidad</text>
  <text x="514" y="477" font-family="Helvetica, Arial, sans-serif" font-size="9.6" fill="#33322e">Agentes de lenguaje</text>
  <text x="514" y="493" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">redactan el hallazgo y responden</text>
  <text x="514" y="506" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">consultas del investigador;</text>
  <text x="514" y="519" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#6d6c68">nunca calculan el número</text>
  <line x1="244" y1="492" x2="249" y2="492" stroke="#8a8985" stroke-width="1.2"/><path d="M249,488 L249,496 L256,492 z" fill="#8a8985"/>
  <line x1="488" y1="492" x2="493" y2="492" stroke="#8a8985" stroke-width="1.2"/><path d="M493,488 L493,496 L500,492 z" fill="#8a8985"/>
  <line x1="380" y1="540" x2="380" y2="559" stroke="#8a8985" stroke-width="1.2"/><path d="M376,559 L384,559 L380,566 z" fill="#8a8985"/>
  <text x="0" y="586" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b0b0b">6 · Consumo — etapa siguiente</text>
  <rect x="0" y="594" width="760" height="28" rx="6" fill="#fcfcfb" stroke="#8a8985" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="14" y="612" font-family="Helvetica, Arial, sans-serif" font-size="9.6" fill="#33322e">Dashboard de visualización · reportes periódicos · consulta en lenguaje natural · explicabilidad de las predicciones</text>
  </svg>